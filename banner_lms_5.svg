<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="45%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="btnGrad5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow5" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3730a3" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bg5)"/>
  <rect width="1200" height="380" rx="16" fill="url(#glow5)"/>

  <!-- AI Wave Network Nodes -->
  <g stroke="#818cf8" stroke-width="1.2" opacity="0.2">
    <line x1="800" y1="120" x2="880" y2="70"/>
    <line x1="880" y1="70" x2="980" y2="110"/>
    <line x1="980" y1="110" x2="1080" y2="60"/>
    <line x1="880" y1="70" x2="920" y2="190"/>
    <line x1="980" y1="110" x2="920" y2="190"/>
    <line x1="920" y1="190" x2="1020" y2="230"/>
    <line x1="1080" y1="60" x2="1020" y2="230"/>
    <line x1="1020" y1="230" x2="1120" y2="200"/>
  </g>
  <circle cx="800" cy="120" r="4" fill="#a5b4fc" opacity="0.6"/>
  <circle cx="880" cy="70" r="5" fill="#818cf8"/>
  <circle cx="980" cy="110" r="6" fill="#ffffff"/>
  <circle cx="1080" cy="60" r="4" fill="#a5b4fc"/>
  <circle cx="920" cy="190" r="5" fill="#818cf8"/>
  <circle cx="1020" cy="230" r="6" fill="#c7d2fe"/>
  <circle cx="1120" cy="200" r="4" fill="#a5b4fc"/>

  <!-- Content -->
  <g transform="translate(60, 45)">
    <!-- Tag Pill -->
    <rect x="0" y="0" width="310" height="30" rx="15" fill="#ffffff" fill-opacity="0.18" stroke="#a5b4fc" stroke-width="1"/>
    <text x="155" y="20" fill="#e0e7ff" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">ĐỘT PHÁ CÔNG NGHỆ VĂN PHÒNG</text>

    <!-- Main Title -->
    <text x="0" y="78" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800">ỨNG DỤNG AI TRONG CÔNG VIỆC</text>

    <!-- Subtitle -->
    <text x="0" y="116" fill="#c7d2fe" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">
      Tối ưu hóa báo cáo dữ liệu, viết văn bản &amp; thiết kế bài thuyết trình tự động
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 142)">
      <rect x="0" y="0" width="220" height="34" rx="8" fill="#ffffff" fill-opacity="0.12"/>
      <circle cx="18" cy="17" r="5" fill="#818cf8"/>
      <text x="32" y="22" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Nâng cao hiệu suất x3 lần</text>

      <rect x="232" y="0" width="240" height="34" rx="8" fill="#ffffff" fill-opacity="0.12"/>
      <circle cx="250" cy="17" r="5" fill="#818cf8"/>
      <text x="264" y="22" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Tích hợp ChatGPT, Copilot, Gemini</text>
    </g>

    <!-- Info line -->
    <text x="0" y="212" fill="#a5b4fc" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Trang bị kỹ năng làm việc tương lai • Phù hợp sinh viên và người đi làm bận rộn
    </text>

    <!-- CTA Button -->
    <g transform="translate(0, 238)" filter="url(#shadow5)">
      <rect x="0" y="0" width="230" height="46" rx="23" fill="url(#btnGrad5)"/>
      <text x="115" y="28" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" text-anchor="middle">ĐĂNG KÝ HỌC NGAY &#8594;</text>
    </g>
  </g>

  <!-- Right Graphic: AI Dashboard Card -->
  <g transform="translate(850, 45)" filter="url(#shadow5)">
    <rect x="20" y="20" width="250" height="230" rx="20" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
    <rect x="35" y="35" width="220" height="40" rx="10" fill="#312e81"/>
    <circle cx="55" cy="55" r="7" fill="#6366f1"/>
    <text x="70" y="60" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">AI WORKFLOW HUB</text>

    <!-- AI Chat bubbles -->
    <rect x="35" y="85" width="180" height="32" rx="8" fill="#2e1065"/>
    <text x="45" y="105" fill="#e9d5ff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Tạo báo cáo doanh số Excel</text>

    <rect x="75" y="125" width="180" height="48" rx="8" fill="#4338ca"/>
    <text x="85" y="145" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Đã xong bảng phân tích &amp;</text>
    <text x="85" y="160" fill="#c7d2fe" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">slide thuyết trình trong 10s</text>

    <!-- Speed gauge -->
    <rect x="35" y="185" width="220" height="48" rx="10" fill="#312e81"/>
    <text x="48" y="206" fill="#a5b4fc" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">HIỆU SUẤT TỐI ƯU</text>
    <rect x="48" y="215" width="150" height="6" rx="3" fill="#1e1b4b"/>
    <rect x="48" y="215" width="135" height="6" rx="3" fill="#818cf8"/>
    <text x="210" y="222" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">300%</text>
  </g>
</svg>