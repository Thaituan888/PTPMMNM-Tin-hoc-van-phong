<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021c38"/>
      <stop offset="45%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="btnGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow1" cx="85%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bg1)"/>
  <rect width="1200" height="380" rx="16" fill="url(#glow1)"/>

  <!-- Decorative Shapes -->
  <circle cx="1120" cy="80" r="140" fill="#38bdf8" opacity="0.08"/>
  <circle cx="980" cy="320" r="180" fill="#0284c7" opacity="0.12"/>
  <path d="M 700 0 L 850 380 L 780 380 L 630 0 Z" fill="#ffffff" opacity="0.03"/>
  <path d="M 800 0 L 950 380 L 900 380 L 750 0 Z" fill="#ffffff" opacity="0.02"/>

  <!-- Left Content -->
  <g transform="translate(60, 45)">
    <!-- Tag Pill -->
    <rect x="0" y="0" width="370" height="30" rx="15" fill="#ffffff" fill-opacity="0.18" stroke="#38bdf8" stroke-width="1"/>
    <text x="185" y="20" fill="#e0f2fe" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">CHUẨN BỘ GIÁO DỤC &amp; ĐÀO TẠO • BTTTT</text>

    <!-- Main Title -->
    <text x="0" y="78" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800">KHÓA HỌC ỨNG DỤNG CNTT CƠ BẢN</text>

    <!-- Subtitle -->
    <text x="0" y="116" fill="#bae6fd" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">
      Làm chủ hệ điều hành Windows, soạn thảo Word, bảng tính Excel &amp; thuyết trình PowerPoint
    </text>

    <!-- Highlight Badges -->
    <g transform="translate(0, 142)">
      <rect x="0" y="0" width="220" height="34" rx="8" fill="#ffffff" fill-opacity="0.12"/>
      <circle cx="18" cy="17" r="5" fill="#38bdf8"/>
      <text x="32" y="22" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Thực hành 100% trên máy Lab</text>

      <rect x="232" y="0" width="230" height="34" rx="8" fill="#ffffff" fill-opacity="0.12"/>
      <circle cx="250" cy="17" r="5" fill="#38bdf8"/>
      <text x="264" y="22" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Giảng viên giàu kinh nghiệm</text>
    </g>

    <!-- Description line -->
    <text x="0" y="212" fill="#93c5fd" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Cấp Chứng chỉ quốc gia có giá trị vô thời hạn toàn quốc • Hỗ trợ học trực tiếp &amp; trực tuyến
    </text>

    <!-- CTA Button -->
    <g transform="translate(0, 238)" filter="url(#shadow1)">
      <rect x="0" y="0" width="230" height="46" rx="23" fill="url(#btnGrad1)"/>
      <text x="115" y="28" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle">XEM DANH SÁCH KHÓA HỌC &#8594;</text>
    </g>
  </g>

  <!-- Right Graphic Illustration -->
  <g transform="translate(860, 50)" filter="url(#shadow1)">
    <!-- Computer Display Card -->
    <rect x="0" y="20" width="270" height="190" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect x="12" y="32" width="246" height="135" rx="8" fill="#0369a1"/>
    
    <!-- Code/Document lines inside screen -->
    <rect x="26" y="48" width="100" height="10" rx="5" fill="#38bdf8"/>
    <rect x="26" y="68" width="160" height="8" rx="4" fill="#bae6fd" opacity="0.8"/>
    <rect x="26" y="84" width="130" height="8" rx="4" fill="#bae6fd" opacity="0.6"/>
    <rect x="26" y="100" width="180" height="8" rx="4" fill="#bae6fd" opacity="0.6"/>
    
    <!-- Mini Chart Bars -->
    <rect x="175" y="125" width="12" height="25" rx="3" fill="#38bdf8"/>
    <rect x="193" y="110" width="12" height="40" rx="3" fill="#7dd3fc"/>
    <rect x="211" y="95" width="12" height="55" rx="3" fill="#ffffff"/>

    <!-- Screen Base -->
    <path d="M 105 210 L 165 210 L 175 235 L 95 235 Z" fill="#334155"/>
    <rect x="80" y="235" width="110" height="8" rx="4" fill="#475569"/>

    <!-- Floating Badge 1: Word/Excel/PPT -->
    <g transform="translate(-40, 150)">
      <rect x="0" y="0" width="130" height="46" rx="10" fill="#ffffff" filter="url(#shadow1)"/>
      <rect x="10" y="9" width="28" height="28" rx="6" fill="#0284c7"/>
      <text x="24" y="28" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">W</text>
      <text x="46" y="22" fill="#0f172a" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">MS Office</text>
      <text x="46" y="35" fill="#0284c7" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Chuẩn Quốc Gia</text>
    </g>

    <!-- Floating Badge 2: Certificate -->
    <g transform="translate(140, 5)">
      <rect x="0" y="0" width="135" height="46" rx="10" fill="#ffffff" filter="url(#shadow1)"/>
      <rect x="10" y="9" width="28" height="28" rx="6" fill="#10b981"/>
      <path d="M 19 23 L 23 27 L 31 17" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <text x="46" y="22" fill="#0f172a" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Chứng Chỉ</text>
      <text x="46" y="35" fill="#10b981" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Bộ GD&amp;ĐT</text>
    </g>
  </g>
</svg>