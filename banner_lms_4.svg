<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="45%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="btnGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow4" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bg4)"/>
  <rect width="1200" height="380" rx="16" fill="url(#glow4)"/>

  <!-- Decorative circles -->
  <circle cx="1100" cy="100" r="140" fill="#a855f7" opacity="0.1"/>
  <circle cx="920" cy="300" r="160" fill="#7c3aed" opacity="0.12"/>

  <!-- Content -->
  <g transform="translate(60, 45)">
    <!-- Tag Pill -->
    <rect x="0" y="0" width="310" height="30" rx="15" fill="#ffffff" fill-opacity="0.18" stroke="#d8b4fe" stroke-width="1"/>
    <text x="155" y="20" fill="#f3e8ff" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">CHỨNG CHỈ QUỐC TẾ MICROSOFT</text>

    <!-- Main Title -->
    <text x="0" y="78" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800">ÔN LUYỆN CHỨNG CHỈ MOS QUỐC TẾ</text>

    <!-- Subtitle -->
    <text x="0" y="116" fill="#e9d5ff" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">
      Chuyên sâu MOS Word, MOS Excel, MOS PowerPoint chuẩn bài thi Certiport
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 142)">
      <rect x="0" y="0" width="220" height="34" rx="8" fill="#ffffff" fill-opacity="0.12"/>
      <circle cx="18" cy="17" r="5" fill="#c084fc"/>
      <text x="32" y="22" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Cam kết chuẩn đầu ra 800+</text>

      <rect x="232" y="0" width="230" height="34" rx="8" fill="#ffffff" fill-opacity="0.12"/>
      <circle cx="250" cy="17" r="5" fill="#c084fc"/>
      <text x="264" y="22" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Phần mềm thi thử bản quyền</text>
    </g>

    <!-- Info line -->
    <text x="0" y="212" fill="#d8b4fe" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Giá trị toàn cầu do Tổng Giám Đốc Microsoft ký tên • Điểm cộng đắt giá cho hồ sơ xin việc
    </text>

    <!-- CTA Button -->
    <g transform="translate(0, 238)" filter="url(#shadow4)">
      <rect x="0" y="0" width="230" height="46" rx="23" fill="url(#btnGrad4)"/>
      <text x="115" y="28" fill="#3b0764" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" text-anchor="middle">XEM KHÓA ÔN MOS &#8594;</text>
    </g>
  </g>

  <!-- Right Graphic: MOS Badge with Laurel -->
  <g transform="translate(850, 45)" filter="url(#shadow4)">
    <rect x="20" y="20" width="250" height="230" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#d8b4fe" stroke-width="2"/>
    <rect x="35" y="35" width="220" height="200" rx="14" fill="#3b0764"/>
    
    <!-- Central MOS Emblem -->
    <circle cx="145" cy="105" r="45" fill="#581c87" stroke="#fbbf24" stroke-width="3"/>
    <text x="145" y="102" fill="#fbbf24" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" text-anchor="middle">MOS</text>
    <text x="145" y="120" fill="#e9d5ff" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">CERTIFIED</text>

    <text x="145" y="172" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" text-anchor="middle">MICROSOFT OFFICE</text>
    <text x="145" y="192" fill="#fbbf24" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">SPECIALIST 2026</text>
    <text x="145" y="214" fill="#d8b4fe" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Chứng chỉ Quốc tế</text>
  </g>
</svg>