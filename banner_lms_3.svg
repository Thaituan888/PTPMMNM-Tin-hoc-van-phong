<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="45%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="btnGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glow3" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bg3)"/>
  <rect width="1200" height="380" rx="16" fill="url(#glow3)"/>

  <!-- Grid Pattern -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.05">
    <line x1="700" y1="0" x2="700" y2="380"/>
    <line x1="800" y1="0" x2="800" y2="380"/>
    <line x1="900" y1="0" x2="900" y2="380"/>
    <line x1="1000" y1="0" x2="1000" y2="380"/>
    <line x1="1100" y1="0" x2="1100" y2="380"/>
    <line x1="650" y1="80" x2="1200" y2="80"/>
    <line x1="650" y1="160" x2="1200" y2="160"/>
    <line x1="650" y1="240" x2="1200" y2="240"/>
    <line x1="650" y1="320" x2="1200" y2="320"/>
  </g>

  <!-- Content -->
  <g transform="translate(60, 45)">
    <!-- Tag Pill -->
    <rect x="0" y="0" width="310" height="30" rx="15" fill="#ffffff" fill-opacity="0.18" stroke="#6ee7b7" stroke-width="1"/>
    <text x="155" y="20" fill="#d1fae5" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">THÔNG BÁO LỊCH KHAI GIẢNG MỚI NHẤT</text>

    <!-- Main Title -->
    <text x="0" y="78" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800">LỊCH KHAI GIẢNG CÁC LỚP TRONG THÁNG</text>

    <!-- Subtitle -->
    <text x="0" y="116" fill="#a7f3d0" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">
      Đa dạng ca học Tối 2-4-6, Tối 3-5-7, Ban ngày và Cuối tuần Thứ 7 - Chủ Nhật
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 142)">
      <rect x="0" y="0" width="220" height="34" rx="8" fill="#ffffff" fill-opacity="0.12"/>
      <circle cx="18" cy="17" r="5" fill="#34d399"/>
      <text x="32" y="22" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Trực tiếp tại trung tâm</text>

      <rect x="232" y="0" width="220" height="34" rx="8" fill="#ffffff" fill-opacity="0.12"/>
      <circle cx="250" cy="17" r="5" fill="#34d399"/>
      <text x="264" y="22" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Trực tuyến tương tác 2 chiều</text>
    </g>

    <!-- Additional info -->
    <text x="0" y="212" fill="#6ee7b7" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Tự động nhập mã lớp khi đăng ký • Xác nhận nhập học nhanh chóng trong 15 phút
    </text>

    <!-- CTA Button -->
    <g transform="translate(0, 238)" filter="url(#shadow3)">
      <rect x="0" y="0" width="240" height="46" rx="23" fill="url(#btnGrad3)"/>
      <text x="120" y="28" fill="#064e3b" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" text-anchor="middle">TRA CỨU LỊCH KHAI GIẢNG &#8594;</text>
    </g>
  </g>

  <!-- Calendar Card Graphic Right -->
  <g transform="translate(850, 45)" filter="url(#shadow3)">
    <!-- Big Calendar Box -->
    <rect x="10" y="15" width="260" height="230" rx="16" fill="#ffffff"/>
    <rect x="10" y="15" width="260" height="50" rx="16" fill="#047857"/>
    <rect x="10" y="45" width="260" height="20" fill="#047857"/>
    
    <!-- Calendar Title -->
    <text x="140" y="45" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="1">LỊCH MỞ LỚP MỚI</text>

    <!-- Calendar items inside -->
    <g transform="translate(25, 75)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="230" height="44" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <rect x="8" y="8" width="55" height="28" rx="6" fill="#059669"/>
      <text x="35" y="26" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">T2-4-6</text>
      <text x="70" y="20" fill="#065f46" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Tin học cơ bản</text>
      <text x="70" y="34" fill="#047857" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">18h30 - 21h00</text>

      <!-- Item 2 -->
      <rect x="0" y="52" width="230" height="44" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <rect x="8" y="60" width="55" height="28" rx="6" fill="#0d9488"/>
      <text x="35" y="78" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">T3-5-7</text>
      <text x="70" y="72" fill="#065f46" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Excel văn phòng</text>
      <text x="70" y="86" fill="#047857" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">18h30 - 21h00</text>

      <!-- Item 3 -->
      <rect x="0" y="104" width="230" height="44" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <rect x="8" y="112" width="55" height="28" rx="6" fill="#047857"/>
      <text x="35" y="130" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">T7 - CN</text>
      <text x="70" y="124" fill="#065f46" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Luyện thi MOS</text>
      <text x="70" y="138" fill="#047857" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">08h00 - 11h30</text>
    </g>
  </g>
</svg>